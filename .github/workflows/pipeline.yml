name: Build & Deploy
on:
    workflow_dispatch:
    push:
        branches:
            - "main"
        paths:
            - migrations/**
            - api/**
            - update-agent/**
            - Dockerfile
            - kubernetes.yml

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            build: ${{ steps.filter.outputs.build }}
            deploy: ${{ steps.filter.outputs.deploy }}
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      build:
                          - 'migrations/**'
                          - 'api/**'
                          - 'update-agent/**'
                          - 'Dockerfile'
                      deploy:
                          - 'kubernetes.yml'

    test:
        needs: detect-changes
        if: needs.detect-changes.outputs.build == 'true'
        uses: v4ldum/shared-workflows/.github/workflows/test-rust.yml@main
        permissions:
            contents: read

    build:
        needs: test
        uses: v4ldum/shared-workflows/.github/workflows/build.yml@main
        secrets: inherit
        with:
            project: finance
        permissions:
            contents: read
            packages: write

    deploy:
        needs: [detect-changes, build]
        if: >-
            !cancelled() && !failure() &&
            (needs.build.result == 'success' ||
              needs.build.result == 'skipped' &&
                needs.detect-changes.outputs.deploy == 'true')
        uses: v4ldum/shared-workflows/.github/workflows/deploy.yml@main
        secrets: inherit
        with:
            project: finance
            apply: ${{ needs.detect-changes.outputs.deploy == 'true' }}
            rollout: ${{ needs.detect-changes.outputs.build == 'true' }}
        permissions:
            contents: read
            id-token: write

    cleanup:
        needs: [build, deploy]
        if: needs.build.result == 'success'
        uses: v4ldum/shared-workflows/.github/workflows/cleanup.yml@main
        secrets: inherit
        with:
            project: finance
        permissions:
            packages: write
