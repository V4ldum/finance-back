[advisories]
# advisory IDs to ignore e.g. ["RUSTSEC-2019-0001", ...]
ignore = [
    "RUSTSEC-2023-0071", # sqlx-mysql is not used
]
informational_warnings = ["notice", "unmaintained", "unsound"] # warn for categories of informational advisories
severity_threshold = "none" # CVSS severity ("none", "low", "medium", "high", "critical")

[output]
quiet = true
# exit non-zero on informational advisories, not just vulnerabilities
deny = ["warnings", "unmaintained", "unsound", "yanked"]

[target]
arch = ["x86_64"]
os = ["linux", "windows", "macos"]
